name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: "1.26"
      - name: Cache Wazero compilation
        uses: actions/cache@v4
        with:
          path: /tmp/wazero-cache
          key: ${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-wazero-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'examples/plugins/**/*.go', 'testdata/**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-wazero-
            ${{ runner.os }}-${{ runner.arch }}-wazero-
      - name: Build
        run: go build ./...
      - name: Build WASM plugins
        run: make testdata
      - name: Test
        run: TORANA_CI_CACHE=/tmp/wazero-cache TORANA_E2E=1 go test ./... -race -timeout 600s
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: golangci-lint
        # Pinned: @latest on the v1 module path silently resolved to the last
        # v1 release, so a v2 release would have broken CI with no code change —
        # and contributors installing golangci-lint today get v2 and could not
        # run the repo's lint at all.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --timeout 5m

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t torana-edge:ci .
      - name: Start image and verify health
        run: |
          container_id=$(docker run -d -p 18080:8080 \
            -e TORANA_DATA_DIR=/tmp/torana \
            -e TORANA_BIND=0.0.0.0 \
            torana-edge:ci)
          trap 'docker logs "$container_id"; docker rm -f "$container_id" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/health && exit 0
            sleep 1
          done
          exit 1
