name: Test

on:
  push:
    branches: [main]
  # No branch filter: a PR is gated wherever it is aimed. With `branches:
  # [main]` only the bottom of a stack ran anything, so every PR above it
  # merged on the strength of someone having run the suite by hand — and the
  # one place a stacked change breaks is the interaction with the commit it
  # sits on, which is exactly what nothing was checking.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Generated bridge output is consumed by real client SDKs as well as our own
  # adapters. This catches required fields and stream accumulator contracts
  # that an internal round-trip can accidentally omit on both sides.
  bridge-client-sdks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install pinned client SDKs
        run: |
          python3 -m venv "$RUNNER_TEMP/bridge-sdk-venv"
          "$RUNNER_TEMP/bridge-sdk-venv/bin/pip" install --require-hashes --only-binary=:all: -r scripts/bridge-sdk-validation-requirements.txt
      - name: Generate bridge contract fixtures
        env:
          GOWORK: "off"
          TORANA_BRIDGE_SDK_FIXTURE_DIR: ${{ runner.temp }}/bridge-sdk-fixtures
        run: go test ./internal/bridge -run '^TestExportSDKValidation.*Fixtures$' -count=1
      - name: Validate JSON and streaming clients without provider calls
        run: |
          "$RUNNER_TEMP/bridge-sdk-venv/bin/python" scripts/validate-bridge-sdk.py \
            --fixtures "$RUNNER_TEMP/bridge-sdk-fixtures"

  # The Rust SDK is distributed from its exact Git revision. Build its
  # all-hooks guest from the same Go-module revision Edge is pinned to, then
  # exercise RespondRequest through Edge's production loader and host calls.
  rust-production-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install the supported Rust and protobuf toolchains
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-wasip1
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Resolve and verify Edge's exact SDK source
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          module=github.com/torana-edge/torana-plugin-sdk
          version=$(go list -m -f '{{.Version}}' "$module")
          metadata=$(go mod download -json "$module@$version")
          directory=$(jq -r '.Dir // empty' <<<"$metadata")
          revision=$(jq -r '.Origin.Hash // empty' <<<"$metadata")
          if [[ -z "$directory" || -z "$revision" ]]; then
            echo "SDK module metadata lacks its extracted directory or VCS revision" >&2
            exit 1
          fi
          pseudo_suffix=${version##*-}
          if [[ "$pseudo_suffix" =~ ^[0-9a-f]{12}$ && "$pseudo_suffix" != "${revision:0:12}" ]]; then
            echo "SDK pseudo-version $version does not resolve to Origin.Hash $revision" >&2
            exit 1
          fi
          test -f "$directory/conformance/guests/rust-allhooks/Cargo.toml"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Build the exact Rust all-hooks guest
        env:
          SDK_SOURCE_DIR: ${{ steps.sdk.outputs.directory }}
        run: |
          cargo +1.85.1 build --locked --target wasm32-wasip1 \
            --target-dir /tmp/torana-rust-allhooks-target \
            --manifest-path "$SDK_SOURCE_DIR/conformance/guests/rust-allhooks/Cargo.toml"
      - name: Exercise Rust authoring and production Edge contracts
        env:
          GOWORK: "off"
          RUSTUP_TOOLCHAIN: 1.85.1
          TORANA_RUST_CONFORMANCE: "1"
          TORANA_RUST_GUEST: /tmp/torana-rust-allhooks-target/wasm32-wasip1/debug/torana-rust-allhooks.wasm
        run: |
          go test ./internal/plugincmd \
            -run '^(TestRustScaffoldFirstRunAgainstPinnedSDK|TestScaffoldRustRevisionMatchesHostModule)$' -count=1
          go test ./internal/plugin \
            -run '^TestCompiledRustRespondRequestThroughProductionRuntime$' -count=1

  # The race suite is the pre-merge gate, sharded across four workers with
  # FULL coverage: internal/wasm, internal/plugin, internal/proxy, and an
  # auto-inventoried remainder. The partition is defined ONCE in
  # scripts/ci-shards.sh and consumed by the matrix, the fixture build, and
  # the exhaustiveness check — no copy of the selection logic lives in YAML.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [wasm, plugin, proxy, remainder]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        id: go
        with:
          go-version: "1.26.6"
      - name: Cache Wazero compilation
        # Per-shard namespace: each worker restores and saves the compiled
        # modules relevant to ITS shard. A shared key would let the fast
        # remainder shard claim the key first with an empty cache, and the
        # heavy shards could never save theirs.
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/wazero-cache
          key: ${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-wazero-${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'examples/plugins/**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-wazero-${{ matrix.shard }}-
            ${{ runner.os }}-${{ runner.arch }}-wazero-${{ matrix.shard }}-
      - name: Build
        run: go build ./...
      - name: Build the shard's fixtures only
        run: |
          fixtures=$(scripts/ci-shards.sh fixtures ${{ matrix.shard }})
          if [ -n "$fixtures" ]; then
            # -j4 for cold multi-fixture builds (measured: 43 fixtures in
            # ~1.2s wall with -j4 vs 16s serial).
            make -j4 $fixtures
          else
            echo "this shard needs no fixtures"
          fi
      - name: Warm the cold SDK-bump fixture cache
        if: matrix.shard == 'wasm'
        # An SDK pin changes every fixture's module bytes. Compiling all of
        # them cold under the race detector exceeds the 30-minute test
        # timeout, while the same non-race compile finishes in minutes and
        # populates the exact wazero cache the race run consumes. On ordinary
        # changes this is a cache-hit check measured in seconds.
        run: |
          test_name=TestFixturesClaimingV1UseCurrentABI
          go test ./internal/wasm -list "^${test_name}$" | grep -Fx "${test_name}"
          GOWORK=off TORANA_CI_CACHE=/tmp/wazero-cache TORANA_E2E=1 \
            go test ./internal/wasm -run "^${test_name}$" -count=1 -timeout 1800s
      - name: Test shard
        run: |
          PKGS=$(scripts/ci-shards.sh ${{ matrix.shard }} | tr '\n' ' ')
          GOWORK=off TORANA_CI_CACHE=/tmp/wazero-cache TORANA_E2E=1 go test $PKGS -race -timeout 1800s

  # Proves the shard partition against the live package inventory. The check
  # itself (duplicates, overlaps, union, cardinality) lives in the same helper
  # the matrix consumes.
  shard-exhaustiveness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
      - name: Verify the shard partition
        run: scripts/ci-shards.sh check

  # Independent proof of the per-package fixture mapping: ONE FRESH CHECKOUT
  # PER heavy package. Each matrix entry builds exactly what ITS package's
  # mapping says and immediately runs that package's strict suite. Any fixture
  # a test requests that the mapping forgot fails here — including
  # dynamically constructed names no static scan can see. (A single job that
  # built wasm's all-42 mapping first would make the other two proofs
  # vacuous.)
  pkg-fixture-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pkg: [./internal/wasm, ./internal/plugin, ./internal/proxy]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
      - name: Build exactly this package's mapped fixtures
        run: make -j4 testdata-pkg PKG=${{ matrix.pkg }}
      - name: This package's strict suite must find every fixture it requests
        run: |
          # -count=1: this job is an EXECUTION proof — a cached pass would
          # prove nothing about the fixtures built just above.
          GOWORK=off TORANA_CI_CACHE=/tmp/wazero-cache TORANA_E2E=1 \
            go test ${{ matrix.pkg }}/... -count=1 -timeout 1800s

  # Vet and vulnerability scanning run once, outside the test matrix.
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Control-plane JavaScript behavior
        run: node --test internal/controlplane/*_test.mjs
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
      - name: POSIX shell syntax (Ubuntu /bin/sh is dash, not bash)
        run: dash -n scripts/ci-shards.sh scripts/testdata.sh scripts/fixtures-for-pkg.sh scripts/check-actions-pinned.sh
      - name: GitHub Actions use immutable commits
        run: scripts/check-actions-pinned.sh
      - name: Vet
        run: GOWORK=off go vet ./...
      # Every platform .goreleaser.yaml claims to ship. Nothing else here builds
      # for anything but the runner's own GOOS, so a platform-specific break
      # (a syscall type that does not exist on Windows, say) stayed invisible
      # until release day, when goreleaser is the first thing to compile it.
      - name: Cross-compile every released platform
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "==> $target"
            GOWORK=off GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done
      - name: Vulnerability scan
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # Platform-specific behaviour, actually executed rather than only compiled.
  #
  # The cross-compile step above proves Windows builds; it cannot prove the
  # per-platform implementations AGREE. internal/pluginfiles has one — the
  # hard-link guard reads Stat_t.Nlink on Unix and GetFileInformationByHandle on
  # Windows — and that guard is a security boundary, so a platform where it
  # silently answered "unknown" would drop the protection while others kept it.
  #
  # Only the packages with platform-specific code: the wazero-heavy suites are
  # slow and add nothing here.
  windows-behaviour:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Platform-sensitive packages
        run: go test ./internal/fileperm/... ./internal/pluginfiles/... ./internal/secret/... ./internal/auditlog/... ./internal/mitm/...
        env:
          GOWORK: "off"

  # The release configuration itself, exercised on every PR rather than first on
  # a tag. The cross-compile step in `analysis` proves the code builds for each
  # platform; this proves .goreleaser.yaml agrees — that its platform matrix,
  # archive formats and ldflags actually produce artifacts. Install the pinned
  # Go module directly, so there is no third-party release action to trust.
  release-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # goreleaser derives the snapshot version from tags
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # sbom needs syft on PATH and publish/announce need a tag; none of that is
      # what this job is checking, and skipping them keeps it hermetic.
      - name: Install pinned GoReleaser
        run: GOWORK=off go install github.com/goreleaser/goreleaser/v2@v2.15.4
      - name: goreleaser snapshot
        run: GOWORK=off goreleaser release --snapshot --clean --skip=sbom,publish,announce
      - name: Validate generated installer assets
        run: go test ./scripts/installertest -run '^TestGeneratedReleaseArtifacts$' -count=1 -v
        env:
          GOWORK: "off"
          TORANA_RELEASE_DIST: ../../dist
      - name: Verify real tag parsing with build metadata (isolated fixture, no publishing)
        run: TORANA_TEST_GORELEASER="$(command -v goreleaser)" GOWORK=off go test ./scripts/installertest -run '^TestGoReleaserBuildMetadata$' -count=1 -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
      - name: golangci-lint
        # Pinned: @latest on the v1 module path silently resolved to the last
        # v1 release, so a v2 release would have broken CI with no code change —
        # and contributors installing golangci-lint today get v2 and could not
        # run the repo's lint at all.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --timeout 5m

  static-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # This replaced a job that built the shipped Docker image and curled
      # /health. Docker is not an artifact for the initial release, but that job
      # was quietly proving something worth keeping: that the binary is fully
      # static and runs with no libc and no shell. Adding a cgo dependency would
      # break it and nothing else here would notice.
      #
      # What this DOES prove: the binary is statically linked, and it starts and
      # serves /health in an environment containing nothing but the binary.
      #
      # What it does NOT prove, deliberately: that outbound HTTPS works. scratch
      # has no CA bundle, and /health makes no upstream call, so TLS to a
      # provider is untested here. The old distroless image did carry CA certs,
      # so that much coverage is genuinely lost — worth restoring alongside a
      # real image, rather than pretended at with a stricter-looking base.
      - name: Build a static binary
        run: CGO_ENABLED=0 go build -trimpath -o torana ./cmd/torana/
      - name: Assert it is statically linked
        run: |
          if file torana | grep -q "dynamically linked"; then
            echo "torana is dynamically linked — a cgo dependency crept in," >&2
            echo "and it will not run in a minimal image or on a host without" >&2
            echo "a matching libc." >&2
            file torana
            exit 1
          fi
          file torana
      - name: Start it in an empty container and verify health
        run: |
          # scratch has nothing at all: no libc, no shell, no /etc, no CA certs.
          # If the binary needs any of it, this fails.
          printf 'FROM scratch\nCOPY torana /torana\nENTRYPOINT ["/torana"]\n' > Dockerfile.cistatic
          docker build -f Dockerfile.cistatic -t torana-static:ci .
          container_id=$(docker run -d -p 18080:8080 \
            -e TORANA_DATA_DIR=/tmp/torana \
            -e TORANA_BIND=0.0.0.0 \
            torana-static:ci)
          trap 'docker logs "$container_id"; docker rm -f "$container_id" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/health && exit 0
            sleep 1
          done
          exit 1
