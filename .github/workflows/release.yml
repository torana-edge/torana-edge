# Prepared here; only a separately authorized future Edge tag activates this.
# No manual dispatch, retagging, release overwrite, or website deployment.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: edge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'torana-edge/torana-edge'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create a new release after verification; never overwrite.
      id-token: write # GitHub-issued signing identity, no long-lived signing key.
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned GitHub CLI verifier
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d "$RUNNER_TEMP/edge-gh.XXXXXX")
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz \
            -o "$tool_dir/gh.tar.gz"
          printf '%s  %s\n' e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be "$tool_dir/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/gh.tar.gz" -C "$tool_dir" gh_2.100.0_linux_amd64/bin/gh
          echo "$tool_dir/gh_2.100.0_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Require new tag on default branch
        id: source
        run: bash scripts/check-release-source.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install pinned Syft for configured archive SBOMs
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - name: Build release assets without publishing
        run: go run github.com/goreleaser/goreleaser/v2@v2.15.4 release --clean --skip=publish,announce
      - name: Validate all six generated installer assets
        run: go test ./scripts/installertest -run '^TestGeneratedReleaseArtifacts$' -count=1 -v
        env:
          TORANA_RELEASE_DIST: ../../dist
          TORANA_RELEASE_VERSION: ${{ steps.source.outputs.version }}
          TORANA_RELEASE_REQUIRE_SBOM: '1'
      - name: Attest release artifact provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          create-storage-record: false
      - name: Verify signed artifacts before publication
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" dist/provenance.sigstore.json
          while read -r _digest asset; do
            gh attestation verify "dist/$asset" --bundle dist/provenance.sigstore.json \
              --repo torana-edge/torana-edge \
              --signer-workflow torana-edge/torana-edge/.github/workflows/release.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done < dist/checksums.txt
      - name: Recheck source and create a new release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.source.outputs.prerelease }}
        run: |
          set -euo pipefail
          bash scripts/check-release-source.sh
          assets=(dist/checksums.txt dist/provenance.sigstore.json)
          while read -r _digest asset; do assets+=("dist/$asset"); done < dist/checksums.txt
          options=(--repo torana-edge/torana-edge --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ $PRERELEASE == true ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${options[@]}"
