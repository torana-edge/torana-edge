name: CLI platforms

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cli-platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test native CLI and isolated background-process lifecycle
        run: go test ./internal/instance ./internal/lifecyclecmd ./internal/controlclient ./internal/controlcmd ./internal/conversationcmd ./cmd/torana -count=1 -timeout 10m
