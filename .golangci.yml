version: "2"
run:
  tests: true
linters:
  # v2 merged gosimple into staticcheck; the rest match the v1 config.
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      # v2 folds stylecheck (ST*) and quickfix (QF*) into staticcheck. v1 ran
      # staticcheck (SA*) plus gosimple (S1*) and nothing else — reproduce that
      # exactly so migrating the config does not silently adopt new rules.
      # Adopting ST*/QF* is a separate decision with real diffs behind it.
      checks:
        - SA*
        - S1*
    errcheck:
      exclude-functions:
        - (*net/http.Server).Serve
        - (*net/http.Server).Shutdown
        - (*net/http.Response).Body.Close
        - (*net/http.Request).Body.Close
        - (io.ReadCloser).Close
        - (io.Closer).Close
        - (net.Listener).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - (*encoding/json.Decoder).Decode
        - encoding/json.Unmarshal
        - io.Copy
        - filepath.Walk
        - (*github.com/fsnotify/fsnotify.Watcher).Add
        - (*github.com/fsnotify/fsnotify.Watcher).Close
        - (*github.com/torana-edge/torana-edge/internal/wasm.Runtime).Close
        - (*github.com/torana-edge/torana-edge/internal/plugin.Runtime).Close
        - github.com/torana-edge/torana-edge/internal/plugin.WatchPlugins
        - github.com/torana-edge/torana-plugin-sdk.HostCall
        - (*github.com/tetratelabs/wazero/api.Module).Close
        - github.com/tetratelabs/wazero/api.Function.Call
        - github.com/tetratelabs/wazero.Runtime.Instantiate
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
        path: _test\.go
      # Go 1.26 deprecated httputil.ReverseProxy.Director. The proxy still sets
      # it (internal/proxy/server.go), and these tests drive the same field.
      # Migrating to Rewrite is a real change — Rewrite does not preserve the
      # inbound Host the way Director did — so it is tracked as follow-up work
      # rather than smuggled into a lint-config migration.
      - linters:
          - staticcheck
        text: 'SA1019.*Director'
      - linters:
          - errcheck
          - staticcheck
        text: HostCall|Close|Shutdown|Serve|WatchPlugins|Call|Instantiate|Walk|otelShutdown|io\.Copy|Add
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
